[project]
name = "edgar-audit-mcp"
version = "0.1.0"
description = "Read-only MCP server for SEC EDGAR: XBRL financials, filing text and tables, segment breakdowns, full-text search, insider and institutional ownership"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
keywords = ["mcp", "sec", "edgar", "xbrl", "finance", "filings", "13f", "form4"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "mcp[cli]==2.0.0",
    "httpx>=0.27,<1.0",
    "pydantic>=2.9,<3.0",
]

[project.optional-dependencies]
# Dogrulama araclarinin UST siniri var, calisma zamani bagimliliklarinin
# bildirilen araliktan fazlasi yok (KK-55, 28 Eyl 2026). Sebep: `ruff`'in
# sectigimiz kural ailelerine (E, F, W, I, UP, B, SIM) yeni surumler yeni
# kurallar ekliyor, `mypy` ara surumlerde yeni hata buluyor, `pytest`'in ara
# surum kullanimdan kaldirma uyarilari CI'da `-W error::DeprecationWarning` ile
# hataya donuyor - ucu de koda dokunmadan bir push'u kirmiziya cevirebilir.
# Bu yuzden ucu de BUGUNKU ara surumlerinde tutuluyor; yukseltmek bilincli
# bir adim (sinirlari yukselt, CI'yi gor). Calisma zamani kaymasini haftalik
# zamanlanmis CI kosusu izliyor (.github/workflows/ci.yml).
dev = ["pytest>=8,<9.2", "anyio>=4,<5", "ruff>=0.6,<0.17", "mypy>=1.11,<2.4",
       "python-dotenv>=1.0,<2.0", "pyyaml>=6.0,<7.0"]

[project.urls]
Homepage = "https://github.com/belermirzaa7-ops/edgar-audit-mcp"
Repository = "https://github.com/belermirzaa7-ops/edgar-audit-mcp"
Issues = "https://github.com/belermirzaa7-ops/edgar-audit-mcp/issues"

[project.scripts]
edgar-audit-mcp = "edgar_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edgar_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Kural seti bilerek acikca yazildi: varsayilana birakilirsa ruff surumu
# degistiginde CI sessizce baska kurallari uygulamaya baslar.
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]   # satir uzunlugunu formatter'a birakiyoruz

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = false
