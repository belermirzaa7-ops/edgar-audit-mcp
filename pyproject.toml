[project]
name = "sec-edgar-mcp"
version = "0.1.0"
description = "Read-only MCP server for SEC EDGAR: XBRL financials, filing text, segments, insider and institutional ownership"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
keywords = ["mcp", "sec", "edgar", "xbrl", "finance", "filings", "13f", "form4"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "mcp[cli]==2.0.0",
    "httpx>=0.27,<1.0",
    "pydantic>=2.9,<3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "anyio>=4", "ruff>=0.6", "mypy>=1.11",
       "python-dotenv>=1.0,<2.0", "pyyaml>=6.0,<7.0"]

[project.urls]
Homepage = "https://github.com/belermirzaa7-ops/sec-edgar-mcp"
Repository = "https://github.com/belermirzaa7-ops/sec-edgar-mcp"
Issues = "https://github.com/belermirzaa7-ops/sec-edgar-mcp/issues"

[project.scripts]
sec-edgar-mcp = "edgar_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edgar_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Kural seti bilerek acikca yazildi: varsayilana birakilirsa ruff surumu
# degistiginde CI sessizce baska kurallari uygulamaya baslar.
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]   # satir uzunlugunu formatter'a birakiyoruz

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = false
