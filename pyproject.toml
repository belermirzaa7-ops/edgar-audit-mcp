[project]
name = "sec-edgar-mcp"
version = "0.1.0"
description = "SEC EDGAR finansal veri MCP sunucusu (MCP 2026-07-28 spesifikasyonu)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]==2.0.0",
    "httpx>=0.27,<1.0",
    "pydantic>=2.9,<3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "anyio>=4", "ruff>=0.6", "mypy>=1.11", "python-dotenv>=1.0,<2.0"]

[project.scripts]
sec-edgar-mcp = "edgar_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edgar_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Kural seti bilerek acikca yazildi: varsayilana birakilirsa ruff surumu
# degistiginde CI sessizce baska kurallari uygulamaya baslar.
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]   # satir uzunlugunu formatter'a birakiyoruz

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = false
