name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # Windows is in the matrix deliberately. Two real bugs shipped that only
    # appear there: `text=True` decodes subprocess output with the local code
    # page (cp1254 on a Turkish install) and crashes on git's UTF-8 output,
    # and a test called `rm -rf`, which does not exist on Windows. A
    # Linux-only matrix is structurally blind to both.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  python-version: "3.11" }
          - { os: ubuntu-latest,  python-version: "3.12" }
          - { os: ubuntu-latest,  python-version: "3.13" }
          - { os: ubuntu-latest,  python-version: "3.14" }
          - { os: windows-latest, python-version: "3.12" }
          - { os: windows-latest, python-version: "3.14" }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e ".[dev]"

      - name: Tests
        # No live SEC calls: the HTTP layer is mocked, so CI never touches
        # sec.gov and never spends the 10 req/s budget.
        run: python -m pytest -q -W error::DeprecationWarning
        env:
          SEC_RATE_LIMIT_PER_SEC: "1000"

      - name: Lint
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python -m ruff check .

      - name: Types
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python -m mypy src

  fault-injection:
    # Standard section 2: a test that has never been seen to fail is not a
    # guarantee. Every protection is deliberately broken and the matching test
    # must turn red. Run on both OSes: the harness shells out to pytest, so it
    # is exposed to the same platform differences as the code it checks.
    #
    # Sharded: the full sweep is ~200 injections and each one runs the whole test
    # suite, so a single process lives a long time -- and on 16 Aug 2026 one was
    # killed part-way through, leaving an injected file behind. Four shards keep
    # each process short and make a failed shard cheap to repeat. `fail-fast` is
    # off deliberately: one broken guard should not hide the state of the rest.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        shard: ["1/4", "2/4", "3/4", "4/4"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python arac/enjeksiyon.py --parca ${{ matrix.shard }}
      # The harness restores every file it breaks. That claim is checked here
      # rather than assumed: a leftover backup or an injected file exits 2.
      #
      # `if: always()` matters more than it looks. Without it the check only
      # ran when the sweep had already succeeded -- that is, only when there
      # was nothing to find. The case worth catching is the sweep that failed
      # or was cancelled part-way, which is exactly the case that skipped it.
      #
      # `--sert` adds a second, independent source: the backup directory is
      # gitignored, so wiping it hides the only evidence a plain check has.
      # In CI the tree is a clean checkout, so comparing against HEAD is
      # meaningful; on a working copy it would flag ordinary edits.
      - run: python arac/enjeksiyon.py --kontrol --sert
        if: always()

  docker:
    # The README advertises running this server over streamable HTTP in a
    # container. That path had never been executed: the SDK binds 127.0.0.1 by
    # default, which inside a container leaves the published port dead. This
    # job builds the image and asks the running container for its tool list
    # from OUTSIDE the container, so the promise is verified, not assumed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t edgar-audit-mcp .
      - name: Answer tools/list from outside the container
        run: |
          docker run -d --name mcp -p 8000:8000 \
            -e SEC_USER_AGENT="CI Runner ci@example.com" edgar-audit-mcp
          for i in $(seq 1 30); do
            if curl -sf -X POST http://127.0.0.1:8000/mcp \
                 -H 'Content-Type: application/json' \
                 -H 'Accept: application/json, text/event-stream' \
                 -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' \
                 | grep -q sec_edgar_get_concept_series; then
              echo "container answered"; exit 0
            fi
            sleep 2
          done
          echo "container never answered on the published port"
          docker logs mcp
          exit 1

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history. The default shallow clone would make the history
          # scan incomplete; the scanner detects that and fails rather than
          # reporting a false "clean".
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python arac/sir_tarama.py --gecmis
